# Template for wrangler.toml. Do not edit this file for your own deploy.
# `npm run setup` (or `npm run dev`) copies it to wrangler.toml, which git ignores.
name = "reading-log"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Close sessions that somebody forgot to stop (see MAX_SESSION_MINUTES).
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Default IANA time zone for the daily totals (Alexa and clients that send no time zone).
# The setup script writes the time zone of your computer here.
TIMEZONE = "UTC"
# A session that runs longer than this is closed automatically at start + this value.
MAX_SESSION_MINUTES = "180"

[[d1_databases]]
binding = "DB"
database_name = "reading_log"
# The setup script replaces this value with the id of your D1 database.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   API_TOKEN      - required. The bearer token for the API and the dashboard.
#   ALEXA_SKILL_ID - required for Alexa only. The skill id (amzn1.ask.skill.xxxx).
